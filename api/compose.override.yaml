---
# Development environment override
services:
  web2mp3_v2_api:
    container_name: "web2mp3_v2_api_dev"
    env_file:
    - path: ./.env.dev
      required: false
    - path: ./.env.dev.local
      required: false
    build:
      context: .
      target: frankenphp_dev
    image: "web2mp3_v2/symfony-dev"
    volumes:
    - ./:/app
    - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
    - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
    # - /app/var
    # If you develop on Mac or Windows you can remove the vendor/ directory
    #  from the bind-mount for better performance by enabling the next line:
    #- /app/vendor
    # - "./php.ini:/usr/local/etc/php/php.ini"
    # - "/srv/docker_data/web2mp3_v2/database:/app/database"
    # - "/srv/docker_data/web2mp3_v2/storage:/app/public/storage"
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
    # Ensure that host.docker.internal is correctly defined on Linux
    - host.docker.internal:host-gateway
    tty: true
    ports:
    - name: http
      target: 80
    #   published: ${HTTP_PORT:-80}
      published: 15080
      protocol: tcp
    # - name: https
    #   target: 443
    # #   published: ${HTTPS_PORT:-443}
    #   published: 15443
    #   protocol: tcp
    # - name: http3
    #   target: 443
    # #   published: ${HTTP3_PORT:-443}
    #   published: 15443
    #   protocol: udp

  web2mp3_v2_workers:
    container_name: "web2mp3_v2_workers_dev"
    env_file:
    - path: "./.env.dev"
      required: false
    - path: "./.env.dev.local"
      required: false
    build:
      context: "."
      target: "frankenphp_dev_workers"
      args:
        UID: "${UID:?}"
        GID: "${GID:?}"
    image: "web2mp3_v2/workers-dev"
    volumes:
    - "./:/app"
    - "./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro"
    - "./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro"

