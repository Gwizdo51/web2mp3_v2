---
name: "web2mp3_v2_api"

networks:
  net:
    name: "webapps"
    external: true

services:
  web2mp3_v2_api:
    container_name: "web2mp3_v2_api"
    image: "web2mp3_v2/symfony"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, web2mp3_v2_api:80
      # DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      DEFAULT_URI: ${DEFAULT_URI:-localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      # DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-15}&charset=${POSTGRES_CHARSET:-utf8}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://web2mp3_v2_api/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # MERCURE_EXTRA_DIRECTIVES: "cors_origins http://debian-server:4200 https://web2mp3-v2.100.124.238.99.nip.io"
    user: "1000:1000"
    networks:
    - "net"
    volumes:
    # - caddy_data:/data
    # - caddy_config:/config
    - "/srv/docker_data/web2mp3_v2/caddy_data:/data"
    - "/srv/docker_data/web2mp3_v2/caddy_config:/config"
    ports:
    - name: http
      target: 80
    #   published: ${HTTP_PORT:-80}
      published: 15080
      protocol: tcp
    - name: https
      target: 443
    #   published: ${HTTPS_PORT:-443}
      published: 15443
      protocol: tcp
    - name: http3
      target: 443
    #   published: ${HTTP3_PORT:-443}
      published: 15443
      protocol: udp
    # restart: unless-stopped

  web2mp3_v2_workers:
    container_name: "web2mp3_v2_workers"
    build:
      context: "."
      target: "frankenphp_workers"
    image: "web2mp3_v2/workers"
    user: "1000:1000"
    networks:
    - "net"
    volumes:
    - "./:/app"
    - "./php.ini:/usr/local/etc/php/php.ini"
    - "./queue_worker.conf:/etc/supervisor/conf.d/queue_worker.conf:ro"
    - "/srv/docker_data/web2mp3_v2/database:/app/database"
    - "/srv/docker_data/web2mp3_v2/storage:/app/public/storage"

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

