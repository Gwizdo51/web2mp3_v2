<div class="flex flex-col grow md:grow-0 place-content-evenly gap-8 md:gap-0">
    <div class="relative flex flex-col items-center">
        @if (download()?.state === 'succeeded') {
            <svg lucideCheck strokeWidth="1" class="absolute bottom-8 md:bottom-5 w-30 h-30 text-green-600"></svg>
            <div class="flex flex-col md:flex-row items-center text-xl pt-20">
                <div class="text-amber-400 max-w-dvw px-5 md:px-0 md:max-w-xl truncate">
                    {{ download()?.fileName }}
                </div>
                &nbsp;is ready !
            </div>
        }
        @else {
            <svg lucideX strokeWidth="1" class="absolute bottom-5 w-30 h-30 text-red-800"></svg>
            <p class="text-xl pt-20 text-center">Something went wrong ...</p>
            <hlm-popover class="absolute -bottom-18">
                <button hlmPopoverTrigger class="py-2 px-5 border-2 border-zinc-700 hover:bg-zinc-700 active:bg-zinc-700 rounded-md cursor-pointer transition-all ease-out duration-100">
                    Show error
                </button>
                <hlm-popover-content class="md:w-175 max-h-50 flex border-2 border-red-800 bg-zinc-950 p-1 mt-2" *hlmPopoverPortal="let ctx">
                    {{ download()?.error }}
                </hlm-popover-content>
            </hlm-popover>
        }
    </div>
    <div>
        <div class="flex flex-col items-center gap-3" [class]="download()?.state === 'succeeded' ? '' : 'hidden md:block md:invisible'">
            <button class="flex items-center gap-2 bg-green-600 rounded-full py-2 px-5 text-2xl hover:bg-green-700 active:bg-green-800 disabled:bg-green-950 disabled:text-zinc-500
            cursor-pointer disabled:cursor-default transition-all ease-out duration-100" [disabled]="download()?.state === 'failed'" (click)="onDownloadLinkClick()">
                <svg lucideDownload class="w-6 h-6"></svg>
                Download
            </button>
            <a #downloadLink [href]="fileUrl()" [download]="download()?.fileName" hidden></a>
            <p class="text-zinc-500 text-center">The download should start automatically</p>
        </div>
    </div>
    <div class="text-center text-xl">
        <a routerLink="/" (click)="onReset()" class="underline hover:decoration-red-600 transition-all ease-out duration-200">
            Convert another link
        </a>
    </div>
</div>
