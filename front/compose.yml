# dev : https://docs.docker.com/guides/angular/develop/
# prod : https://docs.docker.com/guides/angular/containerize/
name: "web2mp3_v2_angular"

# create beforehand
networks:
  net:
    name: "web2mp3_v2_angular"
    # external: true

services:
  node:
    container_name: "web2mp3_v2_angular"
    build:
      context: "./"
      target: "angular_image"
    image: "web2mp3_v2/angular"
    networks:
    - "net"
    working_dir: "/app"
    user: "1000:1000"
    ### SETUP ###
    # volumes:
    # - "./:/app"
    # command: "bash"
    ### DEV ###
    volumes:
    - "./:/app"
    ports:
    - "4200:4200"
    command:
    - "npm"
    - "start"
    ### END DEV ###
    ### PROD ###
    # command:
    # - "npm"
    # -  "run"
    # - "build"
    ### END PROD ###
    # restart: "unless-stopped"
